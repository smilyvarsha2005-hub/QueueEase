<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QueueEase Live Queue</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(212,175,55,0.13),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 100% 100%,
                    rgba(212,175,55,0.06),
                    transparent 30%
                ),
                #050505;

            color: #ffffff;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px;
        }

        body::before {
            content: "";

            position: fixed;

            width: 350px;
            height: 350px;

            border-radius: 50%;

            background: rgba(212,175,55,0.08);

            filter: blur(100px);

            top: -150px;
            left: 50%;

            transform: translateX(-50%);

            pointer-events: none;
        }

        .card {
            position: relative;

            width: 100%;
            max-width: 470px;

            padding: 38px 30px 30px;

            text-align: center;

            border-radius: 28px;

            background:
                linear-gradient(
                    145deg,
                    rgba(25,25,25,0.98),
                    rgba(10,10,10,0.98)
                );

            border: 1px solid rgba(212,175,55,0.35);

            box-shadow:
                0 30px 80px rgba(0,0,0,0.75),
                0 0 35px rgba(212,175,55,0.06);

            overflow: hidden;
        }

        .card::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;
            right: 0;

            height: 3px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #d4af37,
                    #f5d76e,
                    #d4af37,
                    transparent
                );

            box-shadow:
                0 0 15px rgba(212,175,55,0.7);
        }

        .brand-area {
            margin-bottom: 8px;
        }

        .logo {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: 1px;

            color: #d4af37;

            text-shadow:
                0 0 18px rgba(212,175,55,0.25);
        }

        .logo span {
            color: #ffffff;
        }

        .subtitle {
            margin-top: 8px;

            color: #a6a6a6;

            font-size: 13px;

            letter-spacing: 2px;

            text-transform: uppercase;
        }

        .live-indicator {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 8px;

            margin-top: 22px;
            margin-bottom: 12px;

            padding: 7px 14px;

            border-radius: 30px;

            background: rgba(212,175,55,0.08);

            border: 1px solid rgba(212,175,55,0.25);

            color: #d4af37;

            font-size: 11px;

            font-weight: bold;

            letter-spacing: 1.5px;
        }

        .live-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #d4af37;

            box-shadow:
                0 0 8px rgba(212,175,55,0.9);

            animation: livePulse 1.5s infinite;
        }

        @keyframes livePulse {
            0% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.4;
                transform: scale(0.75);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .token-section {
            margin-top: 8px;

            padding: 22px 15px 24px;

            border-radius: 22px;

            background:
                linear-gradient(
                    145deg,
                    rgba(212,175,55,0.07),
                    rgba(255,255,255,0.015)
                );

            border: 1px solid rgba(212,175,55,0.18);
        }

        .token-label {
            font-size: 11px;

            color: #888888;

            text-transform: uppercase;

            letter-spacing: 2px;

            margin-bottom: 3px;
        }

        .token {
            font-size: 72px;

            line-height: 1;

            font-weight: 900;

            margin: 12px 0 18px;

            color: #f5d76e;

            letter-spacing: 2px;

            text-shadow:
                0 0 18px rgba(212,175,55,0.25);
        }

        .status {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            min-width: 150px;

            padding: 9px 20px;

            border-radius: 30px;

            background: #24200f;

            color: #d4af37;

            border: 1px solid rgba(212,175,55,0.28);

            font-size: 13px;

            font-weight: bold;

            letter-spacing: 0.8px;
        }

        .info {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 14px;

            margin-top: 20px;
        }

        .box {
            position: relative;

            background:
                linear-gradient(
                    145deg,
                    #171717,
                    #0e0e0e
                );

            padding: 20px 12px;

            border-radius: 18px;

            border: 1px solid #252525;
        }

        .box::after {
            content: "";

            position: absolute;

            bottom: 0;
            left: 25%;
            right: 25%;

            height: 2px;

            background: #d4af37;

            opacity: 0.45;

            border-radius: 10px;
        }

        .label {
            color: #8d8d8d;

            font-size: 11px;

            text-transform: uppercase;

            letter-spacing: 1.1px;
        }

        .value {
            color: #ffffff;

            font-size: 25px;

            font-weight: 700;

            margin-top: 10px;
        }

        .refresh {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 8px;

            margin-top: 25px;

            color: #777777;

            font-size: 12px;
        }

        .refresh-icon {
            color: #d4af37;

            font-size: 13px;
        }

        .footer {
            margin-top: 18px;

            padding-top: 16px;

            border-top: 1px solid #202020;

            color: #555555;

            font-size: 10px;

            letter-spacing: 1.2px;

            text-transform: uppercase;
        }

        .footer span {
            color: #8d7322;
        }

        .error-message {
            margin-top: 15px;

            color: #ff7777;

            font-size: 12px;

            line-height: 1.5;
        }

        @media (max-width: 500px) {

            body {
                padding: 15px;
            }

            .card {
                padding: 32px 20px 24px;

                border-radius: 24px;
            }

            .logo {
                font-size: 27px;
            }

            .token {
                font-size: 62px;
            }

            .box {
                padding: 17px 8px;
            }

            .value {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

<div class="card">

    <div class="brand-area">

        <div class="logo">
            Queue<span>Ease</span>
        </div>

        <div class="subtitle">
            Live Queue Status
        </div>

    </div>


    <div class="live-indicator">

        <div class="live-dot"></div>

        LIVE QUEUE

    </div>


    <div class="token-section">

        <div class="token-label">
            Your Token
        </div>

        <div
            class="token"
            id="tokenNumber"
        >
            #--
        </div>

        <div
            class="status"
            id="status"
        >
            Loading...
        </div>

    </div>


    <div class="info">

        <div class="box">

            <div class="label">
                Queue Position
            </div>

            <div
                class="value"
                id="position"
            >
                --
            </div>

        </div>


        <div class="box">

            <div class="label">
                Estimated Wait
            </div>

            <div
                class="value"
                id="wait"
            >
                --
            </div>

        </div>

    </div>


    <div
        id="errorMessage"
        class="error-message"
    ></div>


    <div class="refresh">

        <span class="refresh-icon">
            ↻
        </span>

        Live queue updates automatically

    </div>


    <div class="footer">

        Powered by
        <span>QueueEase</span>

    </div>

</div>


<script>

/* =====================================================
   QUEUEEASE LIVE QUEUE
   DIRECT SPRING BOOT CONNECTION
===================================================== */


/* ================= API ================= */

const API_BASE =
    "http://localhost:8080";


/* ================= GET TOKEN ================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const tokenNumber =
    params.get("token");


console.log(
    "QR TOKEN:",
    tokenNumber
);


/* ================= ELEMENTS ================= */

const tokenElement =
    document.getElementById(
        "tokenNumber"
    );


const positionElement =
    document.getElementById(
        "position"
    );


const waitElement =
    document.getElementById(
        "wait"
    );


const statusElement =
    document.getElementById(
        "status"
    );


const errorElement =
    document.getElementById(
        "errorMessage"
    );


/* ================= AUDIO ================= */

let audioContext = null;

let previousStatus = null;


/* ================= UNLOCK AUDIO ================= */

function unlockAudio() {

    try {

        if (!audioContext) {

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        if (
            audioContext.state ===
            "suspended"
        ) {

            audioContext.resume();

        }

    }

    catch (error) {

        console.error(
            "Audio error:",
            error
        );

    }

}


/* ================= BUZZER ================= */

function playBuzzer() {

    try {

        unlockAudio();

        if (!audioContext) {
            return;
        }


        const oscillator =
            audioContext.createOscillator();


        const gain =
            audioContext.createGain();


        oscillator.connect(
            gain
        );


        gain.connect(
            audioContext.destination
        );


        oscillator.type =
            "sine";


        oscillator.frequency.setValueAtTime(
            800,
            audioContext.currentTime
        );


        oscillator.frequency.setValueAtTime(
            600,
            audioContext.currentTime + 0.25
        );


        oscillator.frequency.setValueAtTime(
            900,
            audioContext.currentTime + 0.45
        );


        gain.gain.setValueAtTime(
            0.35,
            audioContext.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            0.01,
            audioContext.currentTime + 0.8
        );


        oscillator.start();


        oscillator.stop(
            audioContext.currentTime + 0.8
        );


        console.log(
            "🔔 Buzzer played"
        );

    }

    catch (error) {

        console.error(
            "Buzzer failed:",
            error
        );

    }

}


/* ================= NOTIFICATION ================= */

async function requestNotificationPermission() {

    if (
        "Notification" in window
    ) {

        try {

            if (
                Notification.permission ===
                "default"
            ) {

                await Notification.requestPermission();

            }

        }

        catch (error) {

            console.log(
                "Notification permission error:",
                error
            );

        }

    }

}


/* ================= TURN NOTIFICATION ================= */

function showTurnNotification(
    token
) {

    if (
        "Notification" in window &&
        Notification.permission ===
        "granted"
    ) {

        new Notification(
            "🔔 QueueEase",
            {
                body:
                    "It's your turn! Token #" +
                    token.tokenNumber +
                    " is being called."
            }
        );

    }

}


/* =====================================================
   LOAD TOKEN STATUS
===================================================== */

async function loadQueue() {

    /* ================= VALIDATE TOKEN ================= */

    if (!tokenNumber) {

        tokenElement.textContent =
            "#--";

        statusElement.textContent =
            "Invalid Token";

        errorElement.textContent =
            "No token number was provided in the QR link.";

        return;

    }


    /* ================= API URL ================= */

    const url =
        API_BASE +
        "/queue/status/" +
        encodeURIComponent(
            tokenNumber
        );


    console.log(
        "Calling:",
        url
    );


    try {

        const response =
            await fetch(
                url
            );


        console.log(
            "HTTP STATUS:",
            response.status
        );


        /* ================= API ERROR ================= */

        if (!response.ok) {

            const errorText =
                await response.text();


            console.error(
                "API ERROR:",
                errorText
            );


            throw new Error(
                "HTTP " +
                response.status
            );

        }


        /* ================= JSON ================= */

        const token =
            await response.json();


        console.log(
            "TOKEN DETAILS:",
            token
        );


        /* ================= TOKEN ================= */

        tokenElement.textContent =
            "#" +
            token.tokenNumber;


        /* ================= POSITION ================= */

        positionElement.textContent =
            token.queuePosition;


        /* ================= WAIT ================= */

        waitElement.textContent =
            token.estimatedWaitingTime +
            " min";


        /* ================= STATUS ================= */

        if (
            token.status ===
            "CALLED"
        ) {

            statusElement.textContent =
                "🔔 YOUR TURN";


            statusElement.style.background =
                "#5b3b00";


            statusElement.style.color =
                "#ffd166";


            statusElement.style.borderColor =
                "#d4af37";


            /* ================= BUZZ ================= */

            if (
                previousStatus !==
                "CALLED"
            ) {

                playBuzzer();

                showTurnNotification(
                    token
                );

            }

        }

        else if (
            token.status ===
            "SERVED"
        ) {

            statusElement.textContent =
                "✅ SERVED";


            statusElement.style.background =
                "#173c2c";


            statusElement.style.color =
                "#55e6a5";


            statusElement.style.borderColor =
                "#55e6a5";

        }

        else {

            statusElement.textContent =
                "WAITING";


            statusElement.style.background =
                "#24200f";


            statusElement.style.color =
                "#d4af37";


            statusElement.style.borderColor =
                "rgba(212,175,55,0.28)";

        }


        /* ================= CLEAR ERROR ================= */

        errorElement.textContent =
            "";


        /* ================= SAVE STATUS ================= */

        previousStatus =
            token.status;

    }

    catch (error) {

        console.error(
            "Live queue error:",
            error
        );


        statusElement.textContent =
            "CONNECTION ERROR";


        statusElement.style.background =
            "#3b1717";


        statusElement.style.color =
            "#ff7777";


        errorElement.textContent =
            "Unable to connect to QueueEase server. " +
            "Make sure Spring Boot is running on port 8080.";

    }

}


/* ================= USER CLICK ================= */

document.addEventListener(
    "click",
    unlockAudio
);


/* ================= START ================= */

requestNotificationPermission();

loadQueue();


/* ================= AUTO REFRESH ================= */

setInterval(
    loadQueue,
    5000
);

</script>

</body>
</html>
